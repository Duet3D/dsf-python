[metadata]
# This includes the license file(s) in the wheel.
# https://wheel.readthedocs.io/en/stable/user_guide.html#including-license-files-in-the-generated-wheel-file
license_files = LICENSE

[flake8]
max-line-length = 120
per-file-ignores =
    # Imports come after the definitions that submodules import back from the package (avoids circular imports)
    src/dsf/__init__.py: E402
    src/dsf/connections/__init__.py: E402
    # Tests embed object model JSON payloads verbatim
    tests/*: E501

[sdist_dsc]
# Force the version to use `~` before any prerelease identifiers
forced-upstream-version = 3.7.0-beta.1
