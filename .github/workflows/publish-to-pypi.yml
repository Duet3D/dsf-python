# This workflow will upload a Python Package using Twine when a release is created

# See https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
# Also see https://github.com/marketplace/actions/pypi-publish

name: Publishing Python Package to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: >-
      Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing
    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  build-deb:
    name: Build Debian package 📦
    runs-on: ubuntu-latest
    # Add permissions for releases
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'
    - name: Install apt packages
      run: sudo apt-get update && sudo apt-get install -y dpkg-dev debhelper dh-python build-essential python3-all
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools
        pip install stdeb3
        pip install wheel
    - name: Clean up previous builds
      run: rm -rf deb_dist/ || true
    - name: Build Debian package
      run: |
        make build_deb || exit 1
    - name: List built packages
      run: find deb_dist -name "*.deb"
    - name: Upload Debian package to release
      uses: softprops/action-gh-release@v2
      with:
        token: ${{ secrets.PAT }}
        files: "deb_dist/*.deb"
        tag_name: ${{ github.event.release.tag_name }}
