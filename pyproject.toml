[build-system]
requires = [
    "setuptools>=42",
    "wheel"
]
build-backend = "setuptools.build_meta"

[tool.pyright]
include = ["src", "tests", "examples"]
# Examples import the package as `dsf`, tests import it as `src.dsf`
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
