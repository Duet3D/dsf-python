[tox]
envlist = py{311,312,313,314}

[testenv]
deps =
    check-manifest
    black
    pyright[nodejs]==1.1.414
    flake8
    pytest
commands =
    check-manifest --ignore 'tox.ini,docs/**,examples/**,tests/**'
    python setup.py check -m -s
    black --check --line-length 120 .
    pyright
    flake8 src examples tests
    pytest
