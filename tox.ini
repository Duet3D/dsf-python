[tox]
envlist = py{311,312,313,314}
# Environments whose Python version is not installed are skipped instead of failing
skip_missing_interpreters = true

[testenv]
deps =
    check-manifest
    black==26.5.1
    pyright[nodejs]==1.1.414
    flake8
    pytest
commands =
    check-manifest
    python setup.py check -m -s
    black --check --line-length 120 .
    pyright
    flake8 src examples tests
    pytest
