[bumpversion]
current_version = 3.6.0-b2.post1
commit = False
tag = False
allow_dirty = False
parse = (?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)(\-(?P<release>[a-z]+)(?P<build>\d+))?(\.post(?P<post>\d+))?
serialize = 
	{major}.{minor}.{patch}-{release}{build}.post{post}
	{major}.{minor}.{patch}-{release}{build}
	{major}.{minor}.{patch}.post{post}
	{major}.{minor}.{patch}

[bumpversion:part:release]
optional_value = prod
first_value = b
values = 
	b
	prod

[bumpversion:part:build]

[bumpversion:file:setup.py]

[bumpversion:file:src/dsf/__init__.py]
replace = {new_version}
